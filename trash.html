<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEACHKO — Trash Bin (Admin)</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css">

    <style>
        .trash-section {
            padding: 40px 5%;
            max-width: 900px;
            margin: 0 auto;
        }

        .trash-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-card {
            background: var(--white);
            padding: 20px;
            border-radius: var(--r-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px dashed var(--border);
            transition: all 0.2s;
        }

        .item-card:hover {
            border-style: solid;
            border-color: var(--gold);
            box-shadow: var(--shadow-sm);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .type-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            font-family: var(--fb);
        }

        .type-booking {
            background: #e3f2fd;
            color: #1976d2;
        }

        .type-artist {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .item-details strong {
            display: block;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .item-details small {
            color: var(--muted-lt);
            font-size: 12px;
        }

        .action-group {
            display: flex;
            gap: 10px;
        }

        .btn-restore {
            padding: 8px 16px;
            background: var(--soft);
            color: var(--text);
            border: 1px solid var(--border-lt);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--fb);
            transition: background 0.2s;
        }

        .btn-restore:hover {
            background: var(--peach);
        }

        .btn-perm-del {
            padding: 8px 16px;
            background: transparent;
            color: #d32f2f;
            border: 1px solid #ffcdd2;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--fb);
        }

        .btn-perm-del:hover {
            background: #fff5f5;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: var(--muted-lt);
            font-family: var(--fb);
        }
    </style>
</head>

<body class="bg-silk">
    <header id="header" class="scrolled">
        <div class="logo">PEACHKO <span style="font-size:12px; opacity:0.6;">ADMIN</span></div>
        <nav>
            <button class="nav-link" onclick="location.href='admin.html'">Dashboard</button>
        </nav>
    </header>

    <div style="height: 80px;"></div>

    <main class="trash-section">
        <div class="section-head" style="text-align: left; margin-bottom: 30px;">
            <div class="label-sm">Recycle</div>
            <h2 class="fd">Trash Bin</h2>
            <p class="fb" style="color: var(--muted); font-size: 14px;">Restore items deleted within the last 30 days or
                delete them permanently.</p>
        </div>

        <div id="trash-list" class="trash-container reveal visible">
            <div class="empty-state">Scanning for deleted items...</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import {
            getFirestore, collection, onSnapshot, query, orderBy, doc, deleteDoc, addDoc, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
            authDomain: "peachko-dev.firebaseapp.com",
            projectId: "peachko-dev",
            storageBucket: "peachko-dev.firebasestorage.app",
            messagingSenderId: "561367230685",
            appId: "1:561367230685:web:5576c1897b5989c243d334"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. 실시간 휴지통 목록 감시
        function watchTrash() {
            const q = query(collection(db, "trash"), orderBy("trashedAt", "desc"));

            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('trash-list');
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = `<div class="empty-state">Your trash bin is empty.</div>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const id = docSnap.id;
                    const isArtist = item.originalCollection === 'artists';
                    const title = isArtist ? item.name : (item.userEmail || "Guest Reservation");
                    const dateStr = item.trashedAt?.toDate().toLocaleString() || "Unknown time";

                    const card = document.createElement('div');
                    card.className = "item-card";
                    card.innerHTML = `
                        <div class="item-info">
                            <span class="type-badge ${isArtist ? 'type-artist' : 'type-booking'}">${item.originalCollection}</span>
                            <div class="item-details">
                                <strong>${title}</strong>
                                <small>Deleted at: ${dateStr}</small>
                            </div>
                        </div>
                        <div class="action-group">
                            <button class="btn-restore" onclick="restoreItem('${id}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">Restore</button>
                            <button class="btn-perm-del" onclick="permanentDelete('${id}')">Delete Permanently</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        // 2. 데이터 복구 (원래 컬렉션으로 이동)
        window.restoreItem = async (trashId, data) => {
            if (!confirm("Do you want to restore this item?")) return;

            try {
                // 원본 데이터에서 휴지통 관련 메타데이터 제거
                const { trashedAt, originalId, originalCollection, ...originalData } = data;

                // 원래 컬렉션에 다시 저장 (ID 유지를 위해 doc(db, col, id)를 쓸 수도 있으나, 여기서는 새로 추가)
                await addDoc(collection(db, originalCollection), {
                    ...originalData,
                    restoredAt: serverTimestamp()
                });

                // 휴지통에서 삭제
                await deleteDoc(doc(db, "trash", trashId));
                alert("Successfully restored.");
            } catch (err) {
                console.error("Restore error:", err);
                alert("Failed to restore: " + err.message);
            }
        };

        // 3. 영구 삭제
        window.permanentDelete = async (trashId) => {
            if (!confirm("This action cannot be undone. Delete permanently?")) return;

            try {
                await deleteDoc(doc(db, "trash", trashId));
                alert("Permanently deleted.");
            } catch (err) {
                alert("Error: " + err.message);
            }
        };

        document.addEventListener('DOMContentLoaded', watchTrash);
    </script>
</body>

</html>
