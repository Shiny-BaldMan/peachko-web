<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEACHKO — Artist Management (Admin)</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css">

    <style>
        .mgmt-section {
            padding: 40px 5%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .mgmt-card {
            background: var(--white);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid var(--border-lt);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--fb);
        }

        th {
            background: var(--silk);
            padding: 18px 15px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--gold);
            border-bottom: 2px solid var(--border-lt);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            vertical-align: middle;
        }

        .artist-thumb {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--peach);
        }

        .badge-svc {
            display: inline-block;
            padding: 3px 8px;
            background: var(--soft);
            color: var(--accent);
            border-radius: 4px;
            font-size: 11px;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        .btn-edit {
            color: #1976d2;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
            margin-right: 12px;
        }

        .btn-del {
            color: #d32f2f;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-edit:hover,
        .btn-del:hover {
            text-decoration: underline;
        }

        .empty-state {
            padding: 60px;
            text-align: center;
            color: var(--muted-lt);
        }
    </style>
</head>

<body class="bg-silk">
    <header id="header" class="scrolled">
        <div class="logo">PEACHKO <span style="font-size:12px; opacity:0.6;">ADMIN</span></div>
        <nav>
            <button class="nav-link" onclick="location.href='admin.html'">Dashboard</button>
            <button class="btn-accent" onclick="location.href='artist-reg.html'"
                style="padding: 10px 20px; font-size: 11px;">+ New Artist</button>
        </nav>
    </header>

    <div style="height: 80px;"></div>
    <main class="mgmt-section">
        <div class="section-head" style="text-align: left; margin-bottom: 30px;">
            <div class="label-sm">Directory</div>
            <h2 class="fd">Artist Management</h2>
            <p class="fb" style="color: var(--muted); font-size: 14px;">Manage profiles, portfolios, and active status
                of your K-beauty experts.</p>
        </div>

        <div class="mgmt-card reveal visible">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Artist</th>
                            <th>Email / Contact</th>
                            <th>Services</th>
                            <th>Experience</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="artist-list">
                        <tr>
                            <td colspan="5" class="empty-state">Loading artist data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import {
            getFirestore, collection, onSnapshot, query, orderBy, doc, deleteDoc, addDoc, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
            authDomain: "peachko-dev.firebaseapp.com",
            projectId: "peachko-dev",
            storageBucket: "peachko-dev.firebasestorage.app",
            messagingSenderId: "561367230685",
            appId: "1:561367230685:web:5576c1897b598"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 실시간 아티스트 목록 로드
        function initArtistMgmt() {
            const q = query(collection(db, "artists"), orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('artist-list');
                tbody.innerHTML = "";

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No artists registered yet.</td></tr>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const artist = docSnap.data();
                    const id = docSnap.id;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <img src="${artist.photoUrl || 'https://via.placeholder.com/100'}" class="artist-thumb">
                                <div>
                                    <div style="font-weight: 600;">${artist.name}</div>
                                    <div style="font-size: 11px; color: var(--gold);">#${artist.styleTags ? artist.styleTags[0] : 'Expert'}</div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div style="font-size: 13px;">${artist.email || 'No Email'}</div>
                            <div style="font-size: 11px; color: var(--muted-lt);">${artist.phone || '-'}</div>
                        </td>
                        <td>
                            ${(artist.services || []).map(s => `<span class="badge-svc">${s}</span>`).join('')}
                        </td>
                        <td style="font-size: 13px; color: var(--muted);">
                            ${artist.regions ? artist.regions.join(', ') : 'Seoul'}
                        </td>
                        <td>
                            <button class="btn-edit" onclick="location.href='artist-edit.html?id=${id}'">Edit</button>
                            <button class="btn-del" onclick="moveToTrash('${id}', ${JSON.stringify(artist).replace(/"/g, '&quot;')})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        // 삭제 처리 (휴지통 이동)
        window.moveToTrash = async (id, data) => {
            if (!confirm(`Are you sure you want to move ${data.name} to trash?`)) return;

            try {
                // 1. 휴지통 컬렉션에 데이터 저장
                await addDoc(collection(db, "trash"), {
                    ...data,
                    originalId: id,
                    originalCollection: "artists",
                    trashedAt: serverTimestamp()
                });

                // 2. 원본 컬렉션에서 삭제
                await deleteDoc(doc(db, "artists", id));
                alert("Artist moved to trash bin.");
            } catch (err) {
                console.error("Delete error:", err);
                alert("Error moving to trash: " + err.message);
            }
        };

        document.addEventListener('DOMContentLoaded', initArtistMgmt);
    </script>
</body>

</html>
