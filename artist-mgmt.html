<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PEACHKO — 아티스트 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@4/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@4/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/700.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-silk">
  <header id="header" class="scrolled">
    <div class="logo">PEACHKO <span style="font-size:12px;opacity:.6;">ADMIN</span></div>
    <nav>
      <button class="nav-link" onclick="location.href='admin.html'">대시보드</button>
      <button class="btn-primary" onclick="location.href='artist-reg.html'" style="padding:10px 20px;font-size:11px;">+ 아티스트 등록</button>
    </nav>
  </header>

  <div style="height:80px;"></div>

  <main class="mgmt-section">
    <div class="section-head-admin" style="margin-bottom:30px;">
      <div class="eyebrow">디렉토리</div>
      <h2>아티스트 관리</h2>
      <p>K-뷰티 전문가들의 프로필, 포트폴리오, 상태를 관리하세요.</p>
    </div>

    <div class="mgmt-card reveal visible">
      <div class="table-wrapper" style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>아티스트</th>
              <th>이메일 / 연락처</th>
              <th>서비스</th>
              <th>활동 지역</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="artist-list">
            <tr><td colspan="5" class="empty-state">아티스트 데이터 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import {
      getFirestore, collection, onSnapshot, doc, deleteDoc, getDoc, addDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
      authDomain: "peachko-dev.firebaseapp.com",
      projectId: "peachko-dev",
      storageBucket: "peachko-dev.firebasestorage.app",
      messagingSenderId: "561367230685",
      appId: "1:561367230685:web:5576c1897b5989c243d334"
    };

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
    const db  = getFirestore(app);

    // 테이블 행 생성
    function renderRow(docSnap) {
      const artist = docSnap.data();
      const id     = docSnap.id;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <div style="display:flex;align-items:center;gap:12px;">
            <img src="${artist.photoUrl || ''}" class="artist-thumb"
                 onerror="this.style.display='none'" style="${artist.photoUrl ? '' : 'display:none'}">
            <div>
              <div style="font-weight:600;">${artist.name || '-'}</div>
              <div style="font-size:11px;color:var(--gold);">#${artist.styleTags?.[0] || 'Expert'}</div>
            </div>
          </div>
        </td>
        <td>
          <div style="font-size:13px;">${artist.email || '이메일 없음'}</div>
          <div style="font-size:11px;color:var(--muted-lt);">${artist.phone || '-'}</div>
        </td>
        <td>${(artist.services || []).map(s => `<span class="badge-svc">${s}</span>`).join('')}</td>
        <td style="font-size:13px;color:var(--muted);">${(artist.regions || ['Seoul']).join(', ')}</td>
        <td>
          <button class="action-btn" onclick="location.href='artist-edit.html?id=${id}'">수정</button>
          <button class="action-btn btn-delete" onclick="moveToTrash('${id}')">삭제</button>
        </td>
      `;
      return tr;
    }

    // 실시간 목록 (orderBy 없이 — 인덱스 불필요)
    function initArtistMgmt() {
      const tbody = document.getElementById('artist-list');

      onSnapshot(
        collection(db, "artists"),
        (snapshot) => {
          tbody.innerHTML = "";
          if (snapshot.empty) {
            tbody.innerHTML = `<tr><td colspan="5" class="empty-state">등록된 아티스트가 없습니다.</td></tr>`;
            return;
          }
          // 클라이언트 측 정렬 (최신순)
          const docs = [];
          snapshot.forEach(d => docs.push(d));
          docs.sort((a, b) => (b.data().createdAt?.seconds ?? 0) - (a.data().createdAt?.seconds ?? 0));
          docs.forEach(d => tbody.appendChild(renderRow(d)));
        },
        (err) => {
          console.error("아티스트 로드 오류:", err);
          tbody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color:#D4533A;">불러오기 실패: ${err.message}</td></tr>`;
        }
      );
    }

    // 휴지통으로 이동 (ID만 넘겨 Firestore에서 직접 조회)
    window.moveToTrash = async (id) => {
      const snap = await getDoc(doc(db, "artists", id));
      if (!snap.exists()) { alert("이미 삭제된 아티스트입니다."); return; }
      const artist = snap.data();

      if (!confirm(`"${artist.name}" 아티스트를 휴지통으로 이동할까요?`)) return;

      try {
        await addDoc(collection(db, "trash"), {
          ...snap.data(),
          originalId:         id,
          originalCollection: "artists",
          trashedAt:          serverTimestamp()
        });
        await deleteDoc(doc(db, "artists", id));
        alert(`"${artist.name}" 아티스트가 휴지통으로 이동됐습니다.`);
      } catch (err) {
        alert("삭제 오류: " + err.message);
      }
    };

    document.addEventListener('DOMContentLoaded', initArtistMgmt);
  </script>
</body>
</html>
