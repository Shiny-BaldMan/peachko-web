<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>PEACHKO — Artist Management</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .mgmt-section {
            padding: 100px 5%;
            max-width: 1000px;
            margin: 0 auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-family: var(--fb);
            font-size: 14px;
        }

        th {
            background: var(--silk);
            color: var(--text);
            font-weight: 600;
        }

        .thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .btn-edit {
            color: var(--accent);
            cursor: pointer;
            margin-right: 10px;
            border: none;
            background: none;
            text-decoration: underline;
        }

        .btn-del {
            color: #ff4d4d;
            cursor: pointer;
            border: none;
            background: none;
            text-decoration: underline;
        }
    </style>
</head>

<body class="bg-silk">
    <header id="header" class="scrolled">
        <div class="logo" style="cursor:pointer;" onclick="location.href='admin.html'">PEACHKO ADMIN</div>
        <nav><button class="btn-ghost" onclick="location.href='admin.html'">Back to Dashboard</button></nav>
    </header>

    <section class="mgmt-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h2 class="fd" style="font-size:28px;">Artist Inventory</h2>
            <button class="btn-accent" onclick="location.href='artist-reg.html'">+ Add New Artist</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Services</th>
                    <th>Regions</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="artistTableBody">
            </tbody>
        </table>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getStorage, ref, deleteObject } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-storage.js";
        import { addDoc, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
            authDomain: "peachko-dev.firebaseapp.com",
            projectId: "peachko-dev",
            storageBucket: "peachko-dev.firebasestorage.app",
            messagingSenderId: "561367230685",
            appId: "1:561367230685:web:5576c1897b5989c243d334"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const storage = getStorage(app);

        // 보안 체크
        document.body.style.display = "none";
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email.toLowerCase() !== 'admin@admin.com') {
                window.location.href = "login.html";
            } else {
                document.body.style.display = "block";
                loadArtists();
            }
        });

        async function loadArtists() {
            const tbody = document.getElementById('artistTableBody');
            const snapshot = await getDocs(collection(db, "artists"));
            tbody.innerHTML = "";

            snapshot.forEach((docSnap) => {
                const artist = docSnap.data();
                const id = docSnap.id;
                const tr = document.createElement('tr');
                tr.innerHTML = `
          <td><img src="${artist.photoUrl}" class="thumb"></td>
          <td><strong>${artist.name}</strong></td>
          <td>${artist.services ? artist.services.join(', ') : '-'}</td>
          <td>${artist.regions ? artist.regions.join(', ') : '-'}</td>
          <td>
            <button class="btn-edit" onclick="location.href='artist-edit.html?id=${id}'">Edit</button>
            <button class="btn-del" onclick="moveToTrash('artists', '${id}', ${JSON.stringify(artist)})">Delete</button>
          </td>
        `;
                tbody.appendChild(tr);
            });
        }

        window.moveToTrash = async (colName, docId, data) => {
            if (!confirm("이 아티스트를 휴지통으로 보낼까요?")) return;

            try {
                // 1. [trash] 컬렉션에 원본 데이터 + 메타데이터 저장
                await addDoc(collection(db, "trash"), {
                    ...data,
                    originalId: docId,
                    originalCollection: colName,
                    trashedAt: serverTimestamp()
                });

                // 2. 원래 [artists] 컬렉션에서 삭제
                await deleteDoc(doc(db, colName, docId));

                alert("휴지통으로 이동되었습니다.");
                location.reload(); // 목록 새로고침
            } catch (err) {
                console.error("휴지통 이동 실패:", err);
                alert("이동 실패: " + err.message);
            }
        };
    </script>
</body>

</html>
