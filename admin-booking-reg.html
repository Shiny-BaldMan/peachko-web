<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEACHKO — 수동 예약 등록</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@4/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@4/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/700.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-silk">
    <header id="header" class="scrolled">
        <div class="logo">PEACHKO <span style="font-size:12px; opacity:0.6;">ADMIN</span></div>
        <nav>
            <button class="btn-secondary" onclick="location.href='admin.html'">대시보드</button>
        </nav>
    </header>

    <section class="reg-section">
        <a href="admin.html" class="nav-back">← 대시보드로 돌아가기</a>

        <div class="reg-card reveal visible">
            <div class="section-head" style="text-align: left; margin-bottom: 30px;">
                <div class="eyebrow">관리자 도구</div>
                <h2>수동 예약 등록</h2>
                <p class="fb" style="color: var(--muted); font-size: 14px;">오프라인 또는 전화 예약을 등록할 때 사용하세요.</p>
            </div>

            <form id="manualBookingForm">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="b-email">고객 이메일 / ID</label>
                        <input type="text" id="b-email" placeholder="customer@example.com or 'Phone Guest'" required>
                    </div>

                    <div class="form-group">
                        <label for="b-artist">담당 아티스트</label>
                        <select id="b-artist" required>
                            <option value="" disabled selected>아티스트 선택</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="b-service">서비스 종류</label>
                        <select id="b-service" required>
                            <option value="makeup">퍼스널 메이크업</option>
                            <option value="hair">K-팝 아이돌 헤어</option>
                            <option value="full">풀 스타일링</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="b-date">예약 날짜</label>
                        <input type="date" id="b-date" required>
                    </div>

                    <div class="form-group">
                        <label for="b-time">시간대</label>
                        <select id="b-time" required>
                            <option value="10:00">오전 10:00</option>
                            <option value="11:30">오전 11:30</option>
                            <option value="13:00">오후 01:00</option>
                            <option value="14:30">오후 02:30</option>
                            <option value="16:00">오후 04:00</option>
                            <option value="17:30">오후 05:30</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label for="b-status">예약 상태</label>
                        <select id="b-status" required>
                            <option value="confirmed">확정 (수동 기본값)</option>
                            <option value="pending">검토 대기</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label for="b-hotel">호텔 주소</label>
                        <input type="text" id="b-hotel" placeholder="방문 서비스 주소를 상세히 입력하세요" required>
                    </div>

                    <div class="form-group full">
                        <label for="b-requests">관리자 메모 / 요청사항</label>
                        <textarea id="b-requests" rows="3" placeholder="추가 사항이나 고객 요청사항을 입력하세요..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width:100%; padding:14px;">예약 저장</button>
            </form>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
            authDomain: "peachko-dev.firebaseapp.com",
            projectId: "peachko-dev",
            storageBucket: "peachko-dev.firebasestorage.app",
            messagingSenderId: "561367230685",
            appId: "1:561367230685:web:5576c1897b5989c243d334"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. 아티스트 목록 로드
        async function loadArtists() {
            const select = document.getElementById('b-artist');
            try {
                const snap = await getDocs(collection(db, "artists"));
                snap.forEach(doc => {
                    const data = doc.data();
                    const opt = document.createElement('option');
                    opt.value = data.name;
                    opt.textContent = data.name;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("아티스트 불러오기 오류:", err);
            }
        }

        // 2. 수동 예약 등록 처리
        document.getElementById('manualBookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = "저장 중...";

            const artist = document.getElementById('b-artist').value;
            const date = document.getElementById('b-date').value;
            const time = document.getElementById('b-time').value;

            // 슬롯 ID 규칙 (중복 방지용 고유 ID 생성)
            const slotId = `${artist}_${date}_${time}`.replace(/\s+/g, '_');

            const bookingData = {
                userEmail: document.getElementById('b-email').value,
                artist: artist,
                serviceType: document.getElementById('b-service').value,
                reservationDate: date,
                reservationTime: time,
                hotelAddress: document.getElementById('b-hotel').value,
                specialRequests: document.getElementById('b-requests').value,
                status: document.getElementById('b-status').value,
                createdAt: serverTimestamp(),
                isManualBooking: true // 수동 예약임을 표시
            };

            try {
                // 참고: 이미 예약된 슬롯인지 체크하는 로직을 추가하면 더 안전합니다.
                await addDoc(collection(db, "bookings"), bookingData);
                alert("예약이 성공적으로 등록됐습니다!");
                window.location.href = "admin.html";
            } catch (err) {
                alert("예약 저장 실패: " + err.message);
                btn.disabled = false;
                btn.textContent = "예약 저장";
            }
        });

        loadArtists();
    </script>
</body>

</html>
