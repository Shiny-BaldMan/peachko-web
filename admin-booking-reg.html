<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEACHKO — Manual Booking (Admin)</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css">

    <style>
        .reg-section {
            padding: 100px 5%;
            max-width: 800px;
            margin: 0 auto;
        }

        .reg-card {
            background: var(--white);
            padding: 40px;
            border-radius: var(--r-lg);
            border: 1px solid var(--border-lt);
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .reg-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gold);
            border-radius: var(--r-lg) var(--r-lg) 0 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-family: var(--fb);
            font-size: 11px;
            font-weight: 600;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        input,
        select,
        textarea {
            padding: 12px;
            border-radius: var(--r-md);
            border: 1px solid var(--border-lt);
            font-family: var(--fb);
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--soft);
        }

        .admin-nav-back {
            margin-bottom: 20px;
            display: inline-block;
            text-decoration: none;
            color: var(--muted);
            font-family: var(--fb);
            font-size: 13px;
        }

        .admin-nav-back:hover {
            color: var(--accent);
        }
    </style>
</head>

<body class="bg-silk">
    <header id="header" class="scrolled">
        <div class="logo">PEACHKO <span style="font-size:12px; opacity:0.6;">ADMIN</span></div>
        <nav>
            <button class="nav-link" onclick="location.href='admin.html'">Dashboard</button>
        </nav>
    </header>

    <section class="reg-section">
        <a href="admin.html" class="admin-nav-back">← Back to Dashboard</a>

        <div class="reg-card reveal visible">
            <div class="section-head" style="text-align: left; margin-bottom: 30px;">
                <div class="label-sm">Admin Tool</div>
                <h2 class="fd">Add Manual Booking</h2>
                <p class="fb" style="color: var(--muted); font-size: 14px;">Use this form to register offline or phone
                    reservations.</p>
            </div>

            <form id="manualBookingForm">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="b-email">Customer Email / ID</label>
                        <input type="text" id="b-email" placeholder="customer@example.com or 'Phone Guest'" required>
                    </div>

                    <div class="form-group">
                        <label for="b-artist">Assigned Artist</label>
                        <select id="b-artist" required>
                            <option value="" disabled selected>Select Artist</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="b-service">Service Type</label>
                        <select id="b-service" required>
                            <option value="makeup">Personal Makeup</option>
                            <option value="hair">K-Pop Idol Hair</option>
                            <option value="full">Full Styling</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="b-date">Reservation Date</label>
                        <input type="date" id="b-date" required>
                    </div>

                    <div class="form-group">
                        <label for="b-time">Time Slot</label>
                        <select id="b-time" required>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:30">11:30 AM</option>
                            <option value="13:00">01:00 PM</option>
                            <option value="14:30">02:30 PM</option>
                            <option value="16:00">04:00 PM</option>
                            <option value="17:30">05:30 PM</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label for="b-status">Booking Status</label>
                        <select id="b-status" required>
                            <option value="confirmed">Confirmed (Default for Manual)</option>
                            <option value="pending">Pending Review</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label for="b-hotel">Hotel Address</label>
                        <input type="text" id="b-hotel" placeholder="Full address for visit service" required>
                    </div>

                    <div class="form-group full">
                        <label for="b-requests">Admin Notes / Requests</label>
                        <textarea id="b-requests" rows="3"
                            placeholder="Enter any additional details or customer requests..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-accent full-btn" style="width: 100%;">Save Reservation</button>
            </form>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
            authDomain: "peachko-dev.firebaseapp.com",
            projectId: "peachko-dev",
            storageBucket: "peachko-dev.firebasestorage.app",
            messagingSenderId: "561367230685",
            appId: "1:561367230685:web:5576c1897b598"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. 아티스트 목록 로드
        async function loadArtists() {
            const select = document.getElementById('b-artist');
            try {
                const snap = await getDocs(collection(db, "artists"));
                snap.forEach(doc => {
                    const data = doc.data();
                    const opt = document.createElement('option');
                    opt.value = data.name;
                    opt.textContent = data.name;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Error loading artists:", err);
            }
        }

        // 2. 수동 예약 등록 처리
        document.getElementById('manualBookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = "Saving...";

            const artist = document.getElementById('b-artist').value;
            const date = document.getElementById('b-date').value;
            const time = document.getElementById('b-time').value;

            // 슬롯 ID 규칙 (중복 방지용 고유 ID 생성)
            const slotId = `${artist}_${date}_${time}`.replace(/\s+/g, '_');

            const bookingData = {
                userEmail: document.getElementById('b-email').value,
                artist: artist,
                serviceType: document.getElementById('b-service').value,
                reservationDate: date,
                reservationTime: time,
                hotelAddress: document.getElementById('b-hotel').value,
                specialRequests: document.getElementById('b-requests').value,
                status: document.getElementById('b-status').value,
                createdAt: serverTimestamp(),
                isManualBooking: true // 수동 예약임을 표시
            };

            try {
                // 참고: 이미 예약된 슬롯인지 체크하는 로직을 추가하면 더 안전합니다.
                await addDoc(collection(db, "bookings"), bookingData);
                alert("Reservation added successfully!");
                window.location.href = "admin.html";
            } catch (err) {
                alert("Failed to save booking: " + err.message);
                btn.disabled = false;
                btn.textContent = "Save Reservation";
            }
        });

        loadArtists();
    </script>
</body>

</html>
