<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>peachko — Book Your Look</title>
  
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  
  <style>
    .booking-section { min-height: 100vh; padding: 120px 5% 80px; }
    .booking-container { max-width: 600px; margin: 0 auto; }
    /* 모바일 대응을 위한 폼 레이아웃 조정 */
    @media (max-width: 480px) {
      .booking-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="bg-peach">

  <header id="header" class="scrolled">
    <div class="logo" style="cursor:pointer;" onclick="location.href='index.html'">peachko</div>
    <nav>
      <button class="btn-ghost" onclick="location.href='index.html'">Back to Home</button>
    </nav>
  </header>

  <section class="booking-section">
    <div class="booking-container">
      
      <div class="section-head reveal visible">
        <div class="label-sm">Reservation</div>
        <h2 class="fd">Complete Your Booking</h2>
        <p class="fb" style="margin-top:10px; color:var(--muted); font-size:14px;">
          Please provide your details for the perfect K-Beauty experience.
        </p>
      </div>

      <form class="booking-form reveal visible" id="mainBookingForm">
        
        <div class="form-row full">
          <label class="form-label">Service Type</label>
          <select id="f-service" required>
            <option value="">Select a service</option>
            <option value="face">Face Makeup (₩80,000~)</option>
            <option value="hair-face">Face + Hair (₩130,000~)</option>
            <option value="full-glam">Full Glam (₩180,000~)</option>
            <option value="special">Special Occasion (₩220,000~)</option>
          </select>
        </div>

        <div class="form-row full">
          <label class="form-label">Preferred Artist</label>
          <select id="f-artist" required>
            <option value="">Select an artist</option>
            <option value="soyeon">Soyeon (Glass Skin)</option>
            <option value="minjae">Minjae (K-Pop Idol)</option>
            <option value="haerin">Haerin (Bridal)</option>
          </select>
        </div>

        <div class="form-row">
          <label class="form-label">Date</label>
          <input type="date" id="f-date" required />
        </div>

        <div class="form-row">
          <label class="form-label">Time</label>
          <input type="time" id="f-time" required />
        </div>

        <div class="form-row full">
          <label class="form-label">Hotel Name / Address in Seoul</label>
          <input type="text" id="f-hotel" placeholder="e.g. Lotte Hotel Seoul, Myeongdong" required />
        </div>

        <div class="form-row full">
          <label class="form-label">Additional Requests (Optional)</label>
          <input type="text" id="f-requests" placeholder="e.g. Sensitive skin, specific style..." />
        </div>

        <button type="submit" class="btn-accent full-btn" style="margin-top:20px;">Confirm Booking</button>
      </form>

      <div class="booking-done hidden" id="successMessage">
        <div class="done-icon">✨</div>
        <h3 class="fd">Booking Received!</h3>
        <p class="fb">Thank you for choosing peachko. We will send a confirmation message to your email/account shortly.</p>
        <button class="btn-ghost" onclick="location.href='index.html'">Back to Home</button>
      </div>

    </div>
  </section>

<script type="module">
    // 1. Firebase 코어, 인증, 그리고 "Firestore(데이터베이스)" 모듈 불러오기
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, doc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    
    // 2. peachko 개발용 설정값
    const firebaseConfig = {
    apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
    authDomain: "peachko-dev.firebaseapp.com",
    projectId: "peachko-dev",
    storageBucket: "peachko-dev.firebasestorage.app",
    messagingSenderId: "561367230685",
    appId: "1:561367230685:web:5576c1897b5989c243d334"
    };

    // 3. Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app); // 데이터베이스 객체 생성!

    // ==========================================
    // 로그인 상태 감시 및 유저 정보 저장
    // ==========================================
    let currentUserEmail = ""; // 예약자의 이메일을 기억할 변수

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserEmail = user.email; // 로그인 성공 시 이메일 저장
        console.log("현재 접속 중인 예약자:", currentUserEmail);
      } else {
        alert("예약을 진행하려면 먼저 로그인이 필요합니다.");
        window.location.href = "login.html"; 
      }
    });

    // ==========================================
    // 예약 데이터 Firestore에 저장하기
    // ==========================================
    const form = document.getElementById('mainBookingForm');
    const successMsg = document.getElementById('successMessage');

    // 폼 제출 시 비동기(async)로 데이터를 서버에 보냅니다.
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); 
      
      // 제출 버튼 비활성화 (중복 클릭 방지)
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.textContent = "Processing...";
      submitBtn.disabled = true;

      try {
        // 입력된 값들 미리 가져오기
        const artistVal = document.getElementById('f-artist').value;
        const dateVal = document.getElementById('f-date').value;
        const timeVal = document.getElementById('f-time').value;

        // 1. 고유 슬롯 ID 생성 (예: soyeon_2026-04-28_16:00)
        const slotId = `${artistVal}_${dateVal}_${timeVal}`;
        const slotRef = doc(db, "bookings", slotId);

        // 2. 트랜잭션 실행
        await runTransaction(db, async (transaction) => {
          const sfDoc = await transaction.get(slotRef);
          
          if (!sfDoc.exists()) {
            // 자리가 비어있으면 저장!
            transaction.set(slotRef, {
              userEmail: currentUserEmail,
              serviceType: document.getElementById('f-service').value,
              artist: artistVal,
              reservationDate: dateVal,
              reservationTime: timeVal,
              hotelAddress: document.getElementById('f-hotel').value,
              specialRequests: document.getElementById('f-requests').value,
              createdAt: serverTimestamp(),
              status: "pending"
            });
          } else {
            // 이미 예약된 자리면 강제 취소!
            throw new Error("이미 예약이 완료된 시간입니다. 다른 시간을 선택해 주세요.");
          }
        });

        console.log("예약 성공! 슬롯 ID:", slotId);
        // 성공 시 폼 숨기고 완료 메시지 띄우기
        form.classList.add('hidden');
        successMsg.classList.remove('hidden');

      } catch (error) {
        console.error("예약 저장 실패:", error);
        alert(error.message); // 트랜잭션 실패 에러 메시지(중복 예약 등)를 띄워줍니다.
        submitBtn.textContent = "Confirm Booking";
        submitBtn.disabled = false;
      }
    });
  </script>
<!-- 여기서부터 추가 (예약 페이지 다국어 스크립트) -->
  <script>
    // 홈페이지에서 설정한 언어 가져오기 (없으면 KO)
    const currentLang = localStorage.getItem("peachko_lang") || "KO";
    
    // 예약 폼 전체 번역 사전
    const T_BOOK = {
      "EN": {
        back: "Back to Home", label: "Reservation", title: "Complete Your Booking", desc: "Please provide your details for the perfect K-Beauty experience.",
        l_svc: "Service Type", l_art: "Preferred Artist", l_date: "Date", l_time: "Time",
        l_hotel: "Hotel Name / Address in Seoul", p_hotel: "e.g. Lotte Hotel Seoul, Myeongdong",
        l_req: "Additional Requests (Optional)", p_req: "e.g. Sensitive skin, specific style...",
        btn: "Confirm Booking", done_h: "Booking Received!", done_p: "Thank you for choosing peachko. We will send a confirmation message shortly.",
        svc_def: "Select a service", art_def: "Select an artist",
        s_face: "Face Makeup (₩80,000~)", s_hair: "Face + Hair (₩130,000~)", s_glam: "Full Glam (₩180,000~)", s_spec: "Special Occasion (₩220,000~)",
        a_soyeon: "Soyeon (Glass Skin)", a_minjae: "Minjae (K-Pop Idol)", a_haerin: "Haerin (Bridal)"
      },
      "KO": {
        back: "홈으로 돌아가기", label: "예약하기", title: "예약 정보 입력", desc: "완벽한 K-뷰티 경험을 위해 상세 정보를 입력해주세요.",
        l_svc: "서비스 종류", l_art: "담당 아티스트", l_date: "예약 날짜", l_time: "예약 시간",
        l_hotel: "숙소명 및 주소 (서울)", p_hotel: "예) 롯데호텔 서울, 명동",
        l_req: "추가 요청사항 (선택)", p_req: "예) 민감성 피부, 원하는 특정 스타일...",
        btn: "예약 완료하기", done_h: "예약이 접수되었습니다!", done_p: "피치코를 이용해 주셔서 감사합니다. 곧 확정 메시지를 보내드립니다.",
        svc_def: "서비스를 선택해주세요", art_def: "아티스트를 선택해주세요",
        s_face: "페이스 메이크업 (₩80,000~)", s_hair: "페이스 + 헤어 (₩130,000~)", s_glam: "풀 글램 (₩180,000~)", s_spec: "스페셜 오케이전 (₩220,000~)",
        a_soyeon: "소연 (글래스 스킨)", a_minjae: "민재 (K-팝 아이돌)", a_haerin: "해린 (웨딩)"
      },
      "JP": {
        back: "ホームに戻る", label: "ご予約", title: "予約情報の入力", desc: "完璧なK-ビューティー体験のために詳細をご入力ください。",
        l_svc: "サービス", l_art: "担当アーティスト", l_date: "日付", l_time: "時間",
        l_hotel: "ホテル名 / ソウルの住所", p_hotel: "例) ロッテホテルソウル 明洞",
        l_req: "特別リクエスト (任意)", p_req: "例) 敏感肌、希望のスタイルなど...",
        btn: "予約を確定する", done_h: "予約完了！", done_p: "ご予約ありがとうございます。間もなく確認メッセージをお送りします。",
        svc_def: "サービスを選択", art_def: "アーティストを選択",
        s_face: "フェイスメイク (₩80,000〜)", s_hair: "フェイス＋ヘア (₩130,000〜)", s_glam: "フルグラム (₩180,000〜)", s_spec: "スペシャル (₩220,000〜)",
        a_soyeon: "ソヨン (グラスキン)", a_minjae: "ミンジェ (K-POPアイドル)", a_haerin: "ヘリン (ブライダル)"
      },
      "ZH": {
        back: "返回首页", label: "预约", title: "填写预约信息", desc: "请提供您的详细信息，以享受完美的K-美妆体验。",
        l_svc: "服务类型", l_art: "首选艺术家", l_date: "日期", l_time: "时间",
        l_hotel: "首尔酒店名称/地址", p_hotel: "例如: 首尔乐天酒店, 明洞",
        l_req: "额外要求 (选填)", p_req: "例如: 敏感肌，特定风格...",
        btn: "确认预约", done_h: "预约成功！", done_p: "感谢您选择peachko。我们将很快发送确认信息。",
        svc_def: "选择服务", art_def: "选择艺术家",
        s_face: "面部彩妆 (₩80,000起)", s_hair: "面部+发型 (₩130,000起)", s_glam: "全套精致妆 (₩180,000起)", s_spec: "特殊场合 (₩220,000起)",
        a_soyeon: "素妍 (玻璃肌)", a_minjae: "敏在 (K-POP偶像)", a_haerin: "海林 (婚礼)"
      }
    };

    // 현재 언어에 맞춰 화면 글자 바꿔치기
    const t = T_BOOK[currentLang];
    if (t) {
      // 1. 일반 텍스트 및 버튼 변경
      document.querySelectorAll('.btn-ghost').forEach(b => b.innerText = t.back);
      document.querySelector('.label-sm').innerText = t.label;
      document.querySelector('.section-head h2').innerText = t.title;
      document.querySelector('.section-head p').innerText = t.desc;
      document.querySelector('button[type="submit"]').innerText = t.btn;
      document.querySelector('.booking-done h3').innerText = t.done_h;
      document.querySelector('.booking-done p').innerText = t.done_p;
      
      // 2. 폼 라벨(Label) 변경
      const labels = document.querySelectorAll('.form-label');
      if(labels.length >= 6) {
        labels[0].innerText = t.l_svc;
        labels[1].innerText = t.l_art;
        labels[2].innerText = t.l_date;
        labels[3].innerText = t.l_time;
        labels[4].innerText = t.l_hotel;
        labels[5].innerText = t.l_req;
      }
      
      // 3. 입력창 가이드 텍스트(Placeholder) 변경
      document.getElementById('f-hotel').placeholder = t.p_hotel;
      document.getElementById('f-requests').placeholder = t.p_req;
      
      // 4. 셀렉트 박스(옵션) 변경
      const svc = document.getElementById('f-service');
      if(svc.options[0]) svc.options[0].text = t.svc_def;
      if(svc.options[1]) svc.options[1].text = t.s_face;
      if(svc.options[2]) svc.options[2].text = t.s_hair;
      if(svc.options[3]) svc.options[3].text = t.s_glam;
      if(svc.options[4]) svc.options[4].text = t.s_spec;
      
      const art = document.getElementById('f-artist');
      if(art.options[0]) art.options[0].text = t.art_def;
      if(art.options[1]) art.options[1].text = t.a_soyeon;
      if(art.options[2]) art.options[2].text = t.a_minjae;
      if(art.options[3]) art.options[3].text = t.a_haerin;
    }
  </script>
  <!-- 여기까지 추가 -->
</body>
</html>
