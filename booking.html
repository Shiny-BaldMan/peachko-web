<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEACHKO — Book Your Look</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@4/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css" />

  <style>
    .booking-page {
      min-height: 100vh;
      padding: 120px 5% 80px;
      background: linear-gradient(140deg, var(--bg), var(--peach));
    }

    .booking-container {
      max-width: 650px;
      margin: 0 auto;
    }

    /* 상태 표시 배너 스타일 */
    .status-banner {
      padding: 15px;
      border-radius: var(--r-md);
      margin-bottom: 20px;
      font-family: var(--fb);
      font-size: 14px;
      display: none;
    }

    .status-banner.show {
      display: block;
    }

    .status-banner.checking {
      background: #e3f2fd;
      color: #1976d2;
      border: 1px solid #bbdefb;
    }

    .status-banner.available {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .status-banner.conflict {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }

    .status-banner.error {
      background: #fff3e0;
      color: #ef6c00;
      border: 1px solid #ffe0b2;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <header id="header" class="scrolled">
    <div class="logo" onclick="location.href='index.html'">PEACHKO</div>
    <nav>
      <div class="lang-wrap">
        <button class="lang-toggle" id="langToggle">KO</button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-opt" data-lang="ko">한국어 (KO)</button>
          <button class="lang-opt" data-lang="en">English (EN)</button>
          <button class="lang-opt" data-lang="zh">中文 (ZH)</button>
        </div>
      </div>
      <button class="nav-link" onclick="location.href='index.html'">Home</button>
      <button class="nav-link" onclick="location.href='index.html#artists'">Artists</button>
    </nav>
  </header>

  <section class="booking-page">
    <div class="booking-container">

      <div id="bookingFormWrap" class="reveal">
        <div class="section-head" style="text-align: left; margin-bottom: 40px;">
          <div class="label-sm">Reservation</div>
          <h2 id="pageTitle">Book Your Beauty Experience</h2>
          <p class="fb" style="color: var(--muted); margin-top: 10px;">Select your preferred artist, date, and time.</p>
        </div>

        <div id="statusBanner" class="status-banner"></div>

        <form id="realBookingForm" class="booking-form">
          <div class="form-row full">
            <label class="form-label">Select Service</label>
            <select id="bookService" required>
              <option value="" disabled selected>Choose a service...</option>
              <option value="makeup">Personal Makeup ($120)</option>
              <option value="hair">K-Pop Idol Hair ($80)</option>
              <option value="full">Full Wedding/Snap Styling ($250)</option>
            </select>
          </div>

          <div class="form-row">
            <label class="form-label">Artist</label>
            <select id="bookArtist" required>
              <option value="" disabled selected>Select Artist...</option>
            </select>
          </div>

          <div class="form-row">
            <label class="form-label">Date</label>
            <input type="date" id="bookDate" required />
          </div>

          <div class="form-row">
            <label class="form-label">Time</label>
            <select id="bookTime" required>
              <option value="" disabled selected>Time...</option>
              <option value="10:00">10:00 AM</option>
              <option value="11:30">11:30 AM</option>
              <option value="13:00">01:00 PM</option>
              <option value="14:30">02:30 PM</option>
              <option value="16:00">04:00 PM</option>
              <option value="17:30">05:30 PM</option>
            </select>
          </div>

          <div class="form-row" style="justify-content: flex-end; align-items: flex-end;">
            <button type="button" id="checkAvailability" class="btn-ghost" style="padding: 12px; width: 100%;">Check
              Availability</button>
          </div>

          <div class="form-row full">
            <label class="form-label">Hotel / Accommodation Address in Seoul</label>
            <input type="text" id="bookHotel" placeholder="Detailed address for the artist to visit" required />
          </div>

          <div class="form-row full">
            <label class="form-label">Special Requests</label>
            <textarea id="bookRequests" rows="3" placeholder="Any allergies, specific styles, or questions?"></textarea>
          </div>

          <button type="submit" id="submitBtn" class="btn-accent full-btn" disabled>Confirm Reservation</button>
        </form>
      </div>

      <div id="bookingDone" class="booking-done hidden reveal">
        <div class="done-icon">✉️</div>
        <h3>Reservation Requested!</h3>
        <p id="successMsg">
          Your booking request has been sent. The artist will review it and you'll receive a confirmation email shortly.
        </p>
        <div id="bookingSummary"
          style="background: var(--soft); padding: 20px; border-radius: 8px; margin-bottom: 30px; text-align: left; font-family: var(--fb); font-size: 14px;">
        </div>
        <button class="btn-accent" onclick="location.href='index.html'">Return to Home</button>
      </div>

    </div>
  </section>

  <script type="module" src="script.js">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, getDocs, collection, setDoc, serverTimestamp, runTransaction
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
      authDomain: "peachko-dev.firebaseapp.com",
      projectId: "peachko-dev",
      storageBucket: "peachko-dev.firebasestorage.app",
      messagingSenderId: "561367230685",
      appId: "1:561367230685:web:5576c1897b598"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserEmail = "";

    // 1. 초기화: 로그인 체크 및 아티스트 목록 로드
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        alert("Please login first to make a reservation.");
        window.location.href = "login.html";
      } else {
        currentUserEmail = user.email;
      }
    });

    async function initPage() {
      const artistSelect = document.getElementById('bookArtist');
      try {
        const querySnapshot = await getDocs(collection(db, "artists"));
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const opt = document.createElement('option');
          opt.value = data.name;
          opt.textContent = data.name;
          artistSelect.appendChild(opt);
        });
      } catch (err) {
        console.error("Error loading artists:", err);
      }
      document.querySelector('.reveal').classList.add('visible');
    }

    // 2. 실시간 예약 가능 여부 확인
    const checkBtn = document.getElementById('checkAvailability');
    const banner = document.getElementById('statusBanner');
    const submitBtn = document.getElementById('submitBtn');

    checkBtn.addEventListener('click', async () => {
      const artist = document.getElementById('bookArtist').value;
      const date = document.getElementById('bookDate').value;
      const time = document.getElementById('bookTime').value;

      if (!artist || !date || !time) {
        alert("Please select Artist, Date, and Time first.");
        return;
      }

      banner.className = "status-banner show checking";
      banner.textContent = "Checking availability...";

      try {
        // 예약 슬롯 ID 생성 (아티스트_날짜_시간 조합으로 고유성 보장)
        const slotId = `${artist}_${date}_${time}`.replace(/\s+/g, '_');
        const slotRef = doc(db, "bookings", slotId);
        const slotSnap = await getDoc(slotRef);

        if (slotSnap.exists()) {
          banner.className = "status-banner show conflict";
          banner.textContent = "Sorry, this slot is already booked. Please try another time.";
          submitBtn.disabled = true;
        } else {
          banner.className = "status-banner show available";
          banner.textContent = "Great! This slot is available for reservation.";
          submitBtn.disabled = false;
        }
      } catch (err) {
        banner.className = "status-banner show error";
        banner.textContent = "Error checking availability. Please try again.";
      }
    });

    // 3. 예약 제출 (트랜잭션 사용으로 중복 방지)
    const form = document.getElementById('realBookingForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const artist = document.getElementById('bookArtist').value;
      const date = document.getElementById('bookDate').value;
      const time = document.getElementById('bookTime').value;
      const service = document.getElementById('bookService').value;
      const hotel = document.getElementById('bookHotel').value;
      const requests = document.getElementById('bookRequests').value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Processing...";

      const slotId = `${artist}_${date}_${time}`.replace(/\s+/g, '_');
      const slotRef = doc(db, "bookings", slotId);

      try {
        await runTransaction(db, async (transaction) => {
          const sfDoc = await transaction.get(slotRef);
          if (sfDoc.exists()) {
            throw "Already booked by someone else!";
          }

          transaction.set(slotRef, {
            userEmail: currentUserEmail,
            artist: artist,
            reservationDate: date,
            reservationTime: time,
            serviceType: service,
            hotelAddress: hotel,
            specialRequests: requests,
            status: "pending",
            createdAt: serverTimestamp()
          });
        });

        // 성공 UI 전환
        document.getElementById('bookingFormWrap').classList.add('hidden');
        const doneBox = document.getElementById('bookingDone');
        doneBox.classList.remove('hidden');
        doneBox.classList.add('visible');

        document.getElementById('bookingSummary').innerHTML = `
          <strong>Service:</strong> ${service.toUpperCase()}<br>
          <strong>Artist:</strong> ${artist}<br>
          <strong>Schedule:</strong> ${date} at ${time}<br>
          <strong>Location:</strong> ${hotel}
        `;

      } catch (err) {
        alert("Reservation failed: " + err);
        submitBtn.disabled = false;
        submitBtn.textContent = "Confirm Reservation";
      }
    });

    initPage();
  </script>
</body>

</html>
