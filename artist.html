<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEACHKO — Artist Profile</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <style>
    .profile-section {
      padding: 120px 5% 60px;
      min-height: 100vh;
      background: var(--bg);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 50px;
    }

    .profile-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid var(--white);
      box-shadow: var(--shadow-lg);
      margin-bottom: 24px;
    }

    .artist-meta {
      max-width: 800px;
      margin: 0 auto;
      background: var(--white);
      padding: 40px;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .info-block h3 {
      font-family: var(--fd);
      font-size: 24px;
      margin-bottom: 15px;
      color: var(--accent);
    }

    .info-block p {
      font-family: var(--fb);
      font-size: 15px;
      line-height: 1.8;
      color: var(--muted);
      white-space: pre-line;
    }

    .badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .badge-tag {
      padding: 5px 12px;
      background: var(--silk);
      color: var(--accent-dk);
      border-radius: 20px;
      font-size: 12px;
      font-family: var(--fb);
    }

    /* Portfolio Gallery */
    .gallery-section {
      padding: 60px 5%;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .gallery-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: var(--r-md);
      cursor: zoom-in;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    .booking-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      padding: 15px 5%;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-top: 1px solid var(--border-lt);
    }

    @media (max-width: 768px) {
      .artist-meta {
        grid-template-columns: 1fr;
        gap: 30px;
      }
    }
  </style>
</head>

<body>
  <header id="header" class="scrolled">
    <div class="logo" onclick="location.href='index.html'">PEACHKO</div>
    <nav>
      <button class="nav-link" onclick="location.href='index.html'">Home</button>
      <button class="nav-link" onclick="location.href='index.html#artists'">All Artists</button>
    </nav>
  </header>

  <section class="profile-section">
    <div id="artistContent" class="reveal">
      <div class="profile-header">
        <img id="p-photo" src="https://via.placeholder.com/200" alt="Artist" class="profile-img" />
        <h1 id="p-name" class="fd" style="font-size: 42px; margin-bottom: 5px;">Loading...</h1>
        <div id="p-tags" class="badge-container" style="justify-content: center;"></div>
      </div>

      <div class="artist-meta">
        <div class="info-block">
          <h3>About Artist</h3>
          <p id="p-intro">Fetching artist information...</p>
        </div>
        <div class="info-block">
          <h3>Career & Education</h3>
          <p id="p-career">Loading career details...</p>
        </div>
        <div class="info-block">
          <h3>Services Provided</h3>
          <div id="p-services" class="badge-container"></div>
        </div>
        <div class="info-block">
          <h3>Social Media</h3>
          <a id="p-sns" href="#" target="_blank" class="btn-ghost"
            style="display: none; padding: 10px 20px; font-size: 12px; margin-top: 10px;">
            Visit Instagram
          </a>
        </div>
      </div>
    </div>
  </section>

  <section class="gallery-section">
    <div class="section-head reveal">
      <div class="label-sm">Visuals</div>
      <h2 class="fd">Work Portfolio</h2>
    </div>
    <div id="p-gallery" class="gallery-grid reveal delay1">
    </div>
  </section>

  <div class="booking-bar">
    <div>
      <span class="fb" style="font-size: 12px; color: var(--muted); display: block;">Starting from</span>
      <span class="fd" style="font-size: 24px; color: var(--accent); font-weight: 600;">$120.00</span>
    </div>
    <button class="btn-accent" id="bookThisArtist" style="padding: 15px 40px;">Book This Artist</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
      authDomain: "peachko-dev.firebaseapp.com",
      projectId: "peachko-dev",
      storageBucket: "peachko-dev.firebasestorage.app",
      messagingSenderId: "561367230685",
      appId: "1:561367230685:web:5576c1897b598"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // URL 파라미터에서 ID 가져오기
    const params = new URLSearchParams(window.location.search);
    const artistId = params.get("id");

    async function loadArtistProfile() {
      if (!artistId) {
        alert("Artist not found.");
        window.location.href = "index.html";
        return;
      }

      try {
        const docRef = doc(db, "artists", artistId);
        const snap = await getDoc(docRef);

        if (snap.exists()) {
          const data = snap.data();

          // 기본 정보 바인딩
          document.getElementById("p-name").innerText = data.name;
          document.getElementById("p-photo").src = data.photoUrl || 'https://via.placeholder.com/200';
          document.getElementById("p-intro").innerText = data.intro || "No introduction provided.";
          document.getElementById("p-career").innerText = data.career || "Career information is private.";

          // SNS 링크
          if (data.instagram) {
            const snsBtn = document.getElementById("p-sns");
            snsBtn.href = data.instagram.startsWith('http') ? data.instagram : `https://instagram.com/${data.instagram}`;
            snsBtn.style.display = "inline-flex";
          }

          // 스타일 태그
          const tagContainer = document.getElementById("p-tags");
          data.styleTags?.forEach(tag => {
            tagContainer.innerHTML += `<span class="badge-tag">#${tag}</span>`;
          });

          // 서비스 목록
          const svcContainer = document.getElementById("p-services");
          data.services?.forEach(svc => {
            svcContainer.innerHTML += `<span class="badge-tag" style="background:var(--peach);">${svc}</span>`;
          });

          // 갤러리 이미지
          const gallery = document.getElementById("p-gallery");
          if (data.portfolioUrls && data.portfolioUrls.length > 0) {
            data.portfolioUrls.forEach(url => {
              gallery.innerHTML += `
                <div class="gallery-item">
                  <img src="${url}" alt="Portfolio work" loading="lazy">
                </div>
              `;
            });
          } else {
            gallery.innerHTML = `<p class="fb" style="grid-column:1/-1; text-align:center; color:var(--muted-lt);">Portfolio images are coming soon.</p>`;
          }

          // 예약 버튼 연동
          document.getElementById("bookThisArtist").onclick = () => {
            window.location.href = `booking.html?artist=${encodeURIComponent(data.name)}`;
          };

          // 애니메이션 활성화
          document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));

        } else {
          alert("Artist does not exist.");
          window.location.href = "index.html";
        }
      } catch (err) {
        console.error("Error fetching artist:", err);
        alert("Failed to load profile.");
      }
    }

    document.addEventListener("DOMContentLoaded", loadArtistProfile);
  </script>
</body>

</html>
