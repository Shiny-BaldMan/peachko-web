<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEACHKO — 관리자 대시보드</title>


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@4/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@4/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/700.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 접근 차단 오버레이 (비admin 차단용) -->
  <div id="accessDenied">
    <h2>🔒 접근 불가</h2>
    <p>관리자 계정만 접근할 수 있습니다. 이동 중...</p>
  </div>

  <div id="adminContent">
    <header class="admin-header">
      <div class="logo" style="color:white;">PEACHKO <span style="font-size:12px; opacity:0.7;">ADMIN</span></div>
      <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
    </header>

    <nav class="admin-nav">
      <a href="admin.html" class="active">예약 관리</a>
      <a href="artist-mgmt.html">아티스트</a>
      <a href="admin-booking-reg.html" class="nav-new">+ 수동 예약</a>
      <a href="artist-reg.html" class="nav-new">+ 아티스트 등록</a>
      <a href="trash.html" class="nav-trash">🗑 휴지통</a>
    </nav>

    <main class="dashboard-container">
      <div class="stats-row">
        <div class="stat-card" style="--stat-color:#D4533A;">
          <h4>전체 예약</h4>
          <p id="stat-total">0</p>
        </div>
        <div class="stat-card" style="--stat-color:#FFAF8A;">
          <h4>대기 중</h4>
          <p id="stat-pending">0</p>
        </div>
        <div class="stat-card" style="--stat-color:#BC9464;">
          <h4>확정</h4>
          <p id="stat-confirmed">0</p>
        </div>
      </div>

      <div class="table-card">
        <div class="table-header">
          <h3>현재 예약 목록</h3>
          <button class="btn-primary" onclick="location.reload()">새로고침</button>
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>날짜 / 시간</th>
                <th>고객</th>
                <th>아티스트</th>
                <th>서비스</th>
                <th>방문지</th>
                <th>상태</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="booking-list">
              <tr>
                <td colspan="7" class="empty-state">예약 불러오는 중...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
      import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
      import {
        getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, addDoc, deleteDoc, serverTimestamp
      } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
        authDomain: "peachko-dev.firebaseapp.com",
        projectId: "peachko-dev",
        storageBucket: "peachko-dev.firebasestorage.app",
        messagingSenderId: "561367230685",
        appId: "1:561367230685:web:5576c1897b5989c243d334"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // 로그아웃 처리
      window.handleLogout = () => {
        signOut(auth).then(() => {
          window.location.href = "login.html";
        });
      };

      const ADMIN_EMAIL = "admin@admin.com";

      // 권한 체크: admin 이메일만 허용, 콘텐츠는 확인 후에만 표시
      onAuthStateChanged(auth, (user) => {
        if (!user || user.email.toLowerCase() !== ADMIN_EMAIL) {
          // 비admin 또는 미로그인 → 오버레이 표시 후 리다이렉트
          document.getElementById('accessDenied').classList.add('show');
          setTimeout(() => { window.location.href = "index.html"; }, 1500);
        } else {
          // admin 확인 완료 → 콘텐츠 표시 + 데이터 로드
          document.getElementById('adminContent').style.display = 'block';
          loadBookings();
        }
      });

      // 실시간 데이터 로드
      function loadBookings() {
        const q = query(collection(db, "bookings"), orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
          const tbody = document.getElementById('booking-list');
          tbody.innerHTML = "";

          let stats = { total: 0, pending: 0, confirmed: 0 };

          snapshot.forEach((docSnap) => {
            const booking = docSnap.data();
            const id = docSnap.id;
            stats.total++;
            if (booking.status === "pending") stats.pending++;
            if (booking.status === "confirmed") stats.confirmed++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
            <td>
              <strong>${booking.reservationDate}</strong><br>
              <span style="color:var(--muted-lt); font-size:11px;">${booking.reservationTime}</span>
            </td>
            <td>
              ${booking.userEmail}<br>
              <span style="font-size:11px; color:var(--gold);">${booking.isManualBooking ? '관리자 등록' : '웹 예약'}</span>
            </td>
            <td>${booking.artist}</td>
            <td>${booking.serviceType.toUpperCase()}</td>
            <td style="max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${booking.hotelAddress}">
              ${booking.hotelAddress}
            </td>
            <td>
              <select class="status-select" onchange="updateStatus('${id}', this.value)">
                <option value="pending" ${booking.status === 'pending' ? 'selected' : ''}>대기 중</option>
                <option value="confirmed" ${booking.status === 'confirmed' ? 'selected' : ''}>확정</option>
                <option value="cancelled" ${booking.status === 'cancelled' ? 'selected' : ''}>취소됨</option>
              </select>
            </td>
            <td>
              <button class="action-btn btn-delete" onclick="moveToTrash('${id}', ${JSON.stringify(booking).replace(/"/g, '&quot;')})">삭제</button>
            </td>
          `;
            tbody.appendChild(tr);
          });

          // 통계 업데이트
          document.getElementById('stat-total').textContent = stats.total;
          document.getElementById('stat-pending').textContent = stats.pending;
          document.getElementById('stat-confirmed').textContent = stats.confirmed;

          if (stats.total === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px;">No reservations found.</td></tr>`;
          }
        });
      }

      // 상태 업데이트
      window.updateStatus = async (id, newStatus) => {
        try {
          await updateDoc(doc(db, "bookings", id), { status: newStatus });
        } catch (err) {
          alert("상태 업데이트 실패: " + err.message);
        }
      };

      // 삭제 처리 (휴지통으로 이동)
      window.moveToTrash = async (id, data) => {
        if (!confirm("이 예약을 휴지통으로 이동할까요?")) return;

        try {
          // 1. 휴지통 컬렉션에 복사본 생성
          await addDoc(collection(db, "trash"), {
            ...data,
            originalId: id,
            originalCollection: "bookings",
            trashedAt: serverTimestamp()
          });

          // 2. 원본 데이터 삭제
          await deleteDoc(doc(db, "bookings", id));
          alert("휴지통으로 이동됐습니다.");
        } catch (err) {
          console.error(err);
          alert("오류: " + err.message);
        }
      };

    </script>
</body>

</html>
