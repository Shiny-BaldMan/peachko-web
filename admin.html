<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEACHKO — Admin Dashboard</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/700.css" />

  <style>
    body {
      background-color: #f8f9fa;
      font-family: var(--fb);
    }

    .admin-header {
      background: var(--dark);
      color: white;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .admin-nav {
      background: white;
      padding: 10px 5%;
      border-bottom: 1px solid var(--border-lt);
      display: flex;
      gap: 20px;
    }

    .admin-nav a {
      text-decoration: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .admin-nav a:hover,
    .admin-nav a.active {
      color: var(--accent);
    }

    .dashboard-container {
      padding: 40px 5%;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      border-left: 4px solid var(--accent);
    }

    .stat-card h4 {
      font-size: 12px;
      color: var(--muted-lt);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .stat-card p {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .table-card {
      background: white;
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .table-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-lt);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #fcfcfc;
      padding: 15px;
      text-align: left;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 2px solid var(--border-lt);
    }

    td {
      padding: 15px;
      font-size: 13px;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }

    .status-pill {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pending {
      background: #fff8e1;
      color: #f57f17;
    }

    .status-confirmed {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status-cancelled {
      background: #ffebee;
      color: #c62828;
    }

    .action-btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: white;
      cursor: pointer;
      font-size: 11px;
      margin-right: 5px;
    }

    .action-btn:hover {
      background: #f5f5f5;
    }

    .btn-delete {
      color: #c62828;
      border-color: #ffcdd2;
    }

    .btn-delete:hover {
      background: #fff5f5;
    }

    select.status-select {
      padding: 5px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
  </style>
</head>

<body>
  <header class="admin-header">
    <div class="logo" style="color:white;">PEACHKO <span style="font-size:12px; opacity:0.7;">ADMIN</span></div>
    <button class="btn-ghost" style="color:white; border-color:rgba(255,255,255,0.3); padding:8px 16px;"
      onclick="handleLogout()">Logout</button>
  </header>

  <nav class="admin-nav">
    <a href="admin.html" class="active">Bookings</a>
    <a href="artist-mgmt.html">Artists</a>
    <a href="admin-booking-reg.html">+ Manual Booking</a>
    <a href="artist-reg.html">+ New Artist</a>
    <a href="trash.html">Trash Bin</a>
  </nav>

  <main class="dashboard-container">
    <div class="stats-row">
      <div class="stat-card">
        <h4>Total Bookings</h4>
        <p id="stat-total">0</p>
      </div>
      <div class="stat-card" style="border-left-color: #f57f17;">
        <h4>Pending</h4>
        <p id="stat-pending">0</p>
      </div>
      <div class="stat-card" style="border-left-color: #2e7d32;">
        <h4>Confirmed</h4>
        <p id="stat-confirmed">0</p>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h3 class="fd">Current Reservations</h3>
        <button class="btn-accent" style="padding:10px 20px; font-size:11px;" onclick="location.reload()">Refresh
          Data</button>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Date / Time</th>
              <th>Customer</th>
              <th>Artist</th>
              <th>Service</th>
              <th>Location</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="booking-list">
            <tr>
              <td colspan="7" style="text-align:center; padding:40px; color:var(--muted-lt);">Loading bookings...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import {
      getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, addDoc, deleteDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
      authDomain: "peachko-dev.firebaseapp.com",
      projectId: "peachko-dev",
      storageBucket: "peachko-dev.firebasestorage.app",
      messagingSenderId: "561367230685",
      appId: "1:561367230685:web:5576c1897b5989c243d334"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 로그아웃 처리
    window.handleLogout = () => {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    };

    // 권한 체크 (간단한 예시: 로그인이 되어있는지 확인)
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        alert("Admin access only.");
        window.location.href = "login.html";
      }
    });

    // 실시간 데이터 로드
    function loadBookings() {
      const q = query(collection(db, "bookings"), orderBy("createdAt", "desc"));

      onSnapshot(q, (snapshot) => {
        const tbody = document.getElementById('booking-list');
        tbody.innerHTML = "";

        let stats = { total: 0, pending: 0, confirmed: 0 };

        snapshot.forEach((docSnap) => {
          const booking = docSnap.data();
          const id = docSnap.id;
          stats.total++;
          if (booking.status === "pending") stats.pending++;
          if (booking.status === "confirmed") stats.confirmed++;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <strong>${booking.reservationDate}</strong><br>
              <span style="color:var(--muted-lt); font-size:11px;">${booking.reservationTime}</span>
            </td>
            <td>
              ${booking.userEmail}<br>
              <span style="font-size:11px; color:var(--gold);">${booking.isManualBooking ? 'Admin Added' : 'User Web'}</span>
            </td>
            <td>${booking.artist}</td>
            <td>${booking.serviceType.toUpperCase()}</td>
            <td style="max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${booking.hotelAddress}">
              ${booking.hotelAddress}
            </td>
            <td>
              <select class="status-select" onchange="updateStatus('${id}', this.value)">
                <option value="pending" ${booking.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="confirmed" ${booking.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                <option value="cancelled" ${booking.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </td>
            <td>
              <button class="action-btn btn-delete" onclick="moveToTrash('${id}', ${JSON.stringify(booking).replace(/"/g, '&quot;')})">Delete</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        // 통계 업데이트
        document.getElementById('stat-total').textContent = stats.total;
        document.getElementById('stat-pending').textContent = stats.pending;
        document.getElementById('stat-confirmed').textContent = stats.confirmed;

        if (stats.total === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px;">No reservations found.</td></tr>`;
        }
      });
    }

    // 상태 업데이트
    window.updateStatus = async (id, newStatus) => {
      try {
        await updateDoc(doc(db, "bookings", id), { status: newStatus });
      } catch (err) {
        alert("Failed to update status: " + err.message);
      }
    };

    // 삭제 처리 (휴지통으로 이동)
    window.moveToTrash = async (id, data) => {
      if (!confirm("Move this reservation to trash?")) return;

      try {
        // 1. 휴지통 컬렉션에 복사본 생성
        await addDoc(collection(db, "trash"), {
          ...data,
          originalId: id,
          originalCollection: "bookings",
          trashedAt: serverTimestamp()
        });

        // 2. 원본 데이터 삭제
        await deleteDoc(doc(db, "bookings", id));
        alert("Moved to trash.");
      } catch (err) {
        console.error(err);
        alert("Error: " + err.message);
      }
    };

    loadBookings();
  </script>
</body>

</html>
