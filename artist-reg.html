<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEACHKO — Register New Artist (Admin)</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css">

    <style>
        .reg-section {
            padding: 100px 5% 60px;
            max-width: 900px;
            margin: 0 auto;
        }

        .reg-card {
            background: var(--white);
            padding: 40px;
            border-radius: var(--r-lg);
            border: 1px solid var(--border-lt);
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .reg-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent);
            border-radius: var(--r-lg) var(--r-lg) 0 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-family: var(--fb);
            font-size: 11px;
            font-weight: 600;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            background: var(--silk);
            padding: 15px;
            border-radius: var(--r-md);
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--fb);
            font-size: 13px;
            cursor: pointer;
        }

        .checkbox-item input {
            width: auto;
        }

        .helper-text {
            font-size: 11px;
            color: var(--muted-lt);
            margin-top: 4px;
        }

        .admin-nav-back {
            margin-bottom: 20px;
            display: inline-block;
            text-decoration: none;
            color: var(--muted);
            font-family: var(--fb);
            font-size: 13px;
        }
    </style>
</head>

<body class="bg-silk">
    <header id="header" class="scrolled">
        <div class="logo">PEACHKO <span style="font-size:12px; opacity:0.6;">ADMIN</span></div>
        <nav>
            <button class="nav-link" onclick="location.href='admin.html'">Dashboard</button>
            <button class="nav-link" onclick="location.href='artist-mgmt.html'">Artists</button>
        </nav>
    </header>

    <section class="reg-section">
        <a href="artist-mgmt.html" class="admin-nav-back">← Back to Artist List</a>

        <div class="reg-card reveal visible">
            <div class="section-head" style="text-align: left; margin-bottom: 30px;">
                <div class="label-sm">Onboarding</div>
                <h2 class="fd">Register New Artist</h2>
                <p class="fb" style="color: var(--muted); font-size: 14px;">Create a professional profile for a new
                    K-beauty expert.</p>
            </div>

            <form id="artistRegForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="a-name">Full Name (English)</label>
                        <input type="text" id="a-name" placeholder="e.g. Minji Kim" required>
                    </div>

                    <div class="form-group">
                        <label for="a-photo">Profile Photo URL</label>
                        <input type="url" id="a-photo" placeholder="https://..." required>
                        <span class="helper-text">Direct link to image (Firebase Storage or external)</span>
                    </div>

                    <div class="form-group">
                        <label for="a-email">Contact Email</label>
                        <input type="email" id="a-email" placeholder="artist@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="a-insta">Instagram ID</label>
                        <input type="text" id="a-insta" placeholder="@username">
                    </div>

                    <div class="form-group full">
                        <label>Provided Services</label>
                        <div class="checkbox-group" id="svc-options">
                            <label class="checkbox-item"><input type="checkbox" name="svc" value="Makeup">
                                Makeup</label>
                            <label class="checkbox-item"><input type="checkbox" name="svc" value="Hair Styling"> Hair
                                Styling</label>
                            <label class="checkbox-item"><input type="checkbox" name="svc" value="Personal Color">
                                Personal Color</label>
                            <label class="checkbox-item"><input type="checkbox" name="svc" value="Wedding Care"> Wedding
                                Care</label>
                            <label class="checkbox-item"><input type="checkbox" name="svc" value="K-Pop Concept"> K-Pop
                                Concept</label>
                        </div>
                    </div>

                    <div class="form-group full">
                        <label for="a-tags">Style Tags (Comma separated)</label>
                        <input type="text" id="a-tags" placeholder="Glowy, Trendy, Natural, Elegant">
                    </div>

                    <div class="form-group full">
                        <label for="a-intro">Short Introduction</label>
                        <textarea id="a-intro" rows="2" placeholder="One-line bio for the listing page..."
                            required></textarea>
                    </div>

                    <div class="form-group full">
                        <label for="a-career">Detailed Career & Education</label>
                        <textarea id="a-career" rows="4"
                            placeholder="List certifications, previous works, or studio experience..."></textarea>
                    </div>

                    <div class="form-group full">
                        <label for="a-regions">Service Regions (Comma separated)</label>
                        <input type="text" id="a-regions" placeholder="Gangnam, Hongdae, Myeongdong" required>
                    </div>
                </div>

                <button type="submit" class="btn-accent full-btn" style="width: 100%;">Create Artist Profile</button>
            </form>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
            authDomain: "peachko-dev.firebaseapp.com",
            projectId: "peachko-dev",
            storageBucket: "peachko-dev.firebasestorage.app",
            messagingSenderId: "561367230685",
            appId: "1:561367230685:web:5576c1897b598"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('artistRegForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = "Registering...";

            // 선택된 서비스 추출
            const selectedServices = Array.from(document.querySelectorAll('input[name="svc"]:checked')).map(cb => cb.value);

            // 태그 및 지역 리스트화
            const styleTags = document.getElementById('a-tags').value.split(',').map(t => t.trim()).filter(t => t !== "");
            const regions = document.getElementById('a-regions').value.split(',').map(r => r.trim()).filter(r => r !== "");

            const artistData = {
                name: document.getElementById('a-name').value,
                photoUrl: document.getElementById('a-photo').value,
                email: document.getElementById('a-email').value,
                instagram: document.getElementById('a-insta').value,
                services: selectedServices,
                styleTags: styleTags,
                intro: document.getElementById('a-intro').value,
                career: document.getElementById('a-career').value,
                regions: regions,
                rating: 5.0, // 초기 평점
                reviewCount: 0,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "artists"), artistData);
                alert("New artist has been registered successfully!");
                window.location.href = "artist-mgmt.html";
            } catch (err) {
                alert("Failed to register artist: " + err.message);
                btn.disabled = false;
                btn.textContent = "Create Artist Profile";
            }
        });
    </script>
</body>

</html>
