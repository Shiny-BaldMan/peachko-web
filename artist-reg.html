<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>PEACHKO — 아티스트 등록 (Admin)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reg-section {
            padding: 100px 5%;
            max-width: 900px;
            margin: 0 auto;
        }

        .reg-card {
            background: var(--white);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-family: var(--fb);
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        input,
        select,
        textarea {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: var(--fb);
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding: 10px 0;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .check-item input {
            width: auto;
        }
    </style>
</head>

<body class="bg-silk">
    <section class="reg-section">
        <div class="reg-card">
            <h2 class="fd" style="margin-bottom: 30px; font-size: 32px;">Register New Artist</h2>

            <form id="artistRegForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Artist Name (영문/한글)</label>
                        <input type="text" id="a-name" placeholder="ex) Soyeon (소연)" required>
                    </div>
                    <div class="form-group">
                        <label>Profile Image URL (jpg, png)</label>
                        <input type="url" id="a-photo" placeholder="https://..." required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="a-email" placeholder="artist@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Contact Number (WhatsApp/Phone)</label>
                        <input type="tel" id="a-phone" placeholder="+82 10-0000-0000" required>
                    </div>
                    <div class="form-group full">
                        <label>Instagram Link</label>
                        <input type="url" id="a-insta" placeholder="https://www.instagram.com/username">
                    </div>

                    <div class="form-group full">
                        <label>Available Services</label>
                        <div class="checkbox-group">
                            <label class="check-item"><input type="checkbox" name="service" value="Makeup">
                                Makeup</label>
                            <label class="check-item"><input type="checkbox" name="service" value="Hair"> Hair</label>
                            <label class="check-item"><input type="checkbox" name="service" value="Idol Makeup"> Idol
                                Makeup</label>
                            <label class="check-item"><input type="checkbox" name="service" value="Wedding">
                                Wedding</label>
                        </div>
                    </div>

                    <div class="form-group full">
                        <label>Available Days</label>
                        <div class="checkbox-group">
                            <label class="check-item"><input type="checkbox" name="day" value="Mon"> Mon</label>
                            <label class="check-item"><input type="checkbox" name="day" value="Tue"> Tue</label>
                            <label class="check-item"><input type="checkbox" name="day" value="Wed"> Wed</label>
                            <label class="check-item"><input type="checkbox" name="day" value="Thu"> Thu</label>
                            <label class="check-item"><input type="checkbox" name="day" value="Fri"> Fri</label>
                            <label class="check-item"><input type="checkbox" name="day" value="Sat"> Sat</label>
                            <label class="check-item"><input type="checkbox" name="day" value="Sun"> Sun</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Working Hours (Start)</label>
                        <input type="time" id="a-time-start" value="10:00">
                    </div>
                    <div class="form-group">
                        <label>Working Hours (End)</label>
                        <input type="time" id="a-time-end" value="20:00">
                    </div>

                    <div class="form-group full">
                        <label>Service Regions (출장 가능 지역, 쉼표로 구분)</label>
                        <input type="text" id="a-regions" placeholder="ex) Gangnam, Hongdae, Myeongdong">
                    </div>
                    <div class="form-group full">
                        <label>Career & Introduction</label>
                        <textarea id="a-intro" rows="4" placeholder="아티스트의 경력과 스타일을 자유롭게 적어주세요."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-accent full-btn" style="height: 50px; font-size: 16px;">Save Artist
                    Profile</button>
            </form>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
            authDomain: "peachko-dev.firebaseapp.com",
            projectId: "peachko-dev",
            storageBucket: "peachko-dev.firebasestorage.app",
            messagingSenderId: "561367230685",
            appId: "1:561367230685:web:5576c1897b5989c243d334"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // 보안: admin@admin.com 확인 로직
        document.body.style.display = "none";
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email.toLowerCase() !== 'admin@admin.com') {
                alert("Access Denied.");
                window.location.href = "login.html";
            } else {
                document.body.style.display = "block";
            }
        });

        // 폼 제출 이벤트
        document.getElementById('artistRegForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // 체크박스 값 배열로 만들기
            const selectedServices = Array.from(document.querySelectorAll('input[name="service"]:checked')).map(el => el.value);
            const selectedDays = Array.from(document.querySelectorAll('input[name="day"]:checked')).map(el => el.value);
            const regionList = document.getElementById('a-regions').value.split(',').map(r => r.trim()).filter(r => r !== "");

            const artistData = {
                name: document.getElementById('a-name').value,
                photoUrl: document.getElementById('a-photo').value,
                email: document.getElementById('a-email').value,
                phone: document.getElementById('a-phone').value,
                instagram: document.getElementById('a-insta').value,
                services: selectedServices,
                availableDays: selectedDays,
                workHours: {
                    start: document.getElementById('a-time-start').value,
                    end: document.getElementById('a-time-end').value
                },
                regions: regionList,
                intro: document.getElementById('a-intro').value,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "artists"), artistData);
                alert("Artist registered successfully!");
                window.location.href = "admin.html";
            } catch (err) {
                console.error("Error saving artist:", err);
                alert("Failed to save data.");
            }
        });
    </script>
</body>

</html>
