<body class="bg-gradient">

  <header id="header" class="scrolled">

    <nav>
      <button class="btn-ghost" onclick="location.href='index.html'">Back to Home</button>
    </nav>
  </header>

  <section class="auth-section">
    <div class="booking-wrap" style="width: 100%; max-width: 420px;">
      
      <div class="section-head" style="margin-bottom: 30px;">
        <div class="label-sm" id="authLabel">Welcome Back</div>
        <h2 class="fd" id="authTitle">Log In</h2>
      </div>

      <div class="booking-form" style="display: flex; flex-direction: column; gap: 16px; padding: 40px 32px;">
        
        <div class="form-row full">
          <label class="form-label">Email Address</label>
          <input type="email" id="emailInput" placeholder="name@example.com" required />
        </div>
        
        <div class="form-row full">
          <label class="form-label">Password</label>
          <input type="password" id="passwordInput" placeholder="••••••••" required />
        </div>

        <button class="btn-accent full-btn" id="authActionBtn">Log In</button>

        <div class="auth-toggle" id="authToggleBtn">Don't have an account? Sign up</div>
        
      </div>
    </div>
  </section>

  <script type="module">
    // 1. Firebase 라이브러리 불러오기 (최신 v10 모듈 방식)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    // 2. 전달해주신 peachko 개발용 설정값
    const firebaseConfig = {
      apiKey: "AIzaSyCnByhLp-UyVaVOpEERqNBJKeIcipPILE0",
      authDomain: "peachko-dev.firebaseapp.com",
      projectId: "peachko-dev",
      storageBucket: "peachko-dev.firebasestorage.app",
      messagingSenderId: "675915261853",
      appId: "1:675915261853:web:58dce392b1103dd6c1b174"
    };

    // 3. Firebase 초기화 및 인증 객체 가져오기
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ==========================================
    // UI 조작 및 로그인 로직
    // ==========================================
    let isLogin = true;
    
    const authLabel = document.getElementById('authLabel');
    const authTitle = document.getElementById('authTitle');
    const authActionBtn = document.getElementById('authActionBtn');
    const authToggleBtn = document.getElementById('authToggleBtn');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');

    // 하단 텍스트 클릭 시 (로그인 <-> 회원가입 전환)
    authToggleBtn.addEventListener('click', () => {
      isLogin = !isLogin;
      if (isLogin) {
        authLabel.textContent = "Welcome Back";
        authTitle.textContent = "Log In";
        authActionBtn.textContent = "Log In";
        authToggleBtn.textContent = "Don't have an account? Sign up";
      } else {
        authLabel.textContent = "Join Us";
        authTitle.textContent = "Create Account";
        authActionBtn.textContent = "Sign Up";
        authToggleBtn.textContent = "Already have an account? Log in";
      }
    });

    // 메인 버튼 (Log In 또는 Sign Up) 클릭 시 실행할 함수
    authActionBtn.addEventListener('click', (e) => {
      e.preventDefault(); // 폼 기본 제출 동작 방지
      
      const email = emailInput.value;
      const password = passwordInput.value;

      // 간단한 입력 확인
      if (!email || !password) {
        alert("이메일과 비밀번호를 모두 입력해주세요.");
        return;
      }

      if (isLogin) {
        // [로그인 로직]
        signInWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            alert("로그인 성공! 환영합니다.");
            // 로그인 성공 시 메인 홈페이지로 이동
            window.location.href = "index.html"; 
          })
          .catch((error) => {
            alert("로그인 실패: " + error.message);
            console.error(error);
          });
          
      } else {
        // [회원가입 로직]
        createUserWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            alert("회원가입 완료! peachko에 오신 것을 환영합니다.");
            // 가입 성공 시 메인 홈페이지로 이동
            window.location.href = "index.html";
          })
          .catch((error) => {
            // 이미 있는 이메일이거나 비밀번호가 6자리 미만일 때 에러 표시
            alert("회원가입 실패: " + error.message);
            console.error(error);
          });
      }
    });
  </script>
</body>
</html>
