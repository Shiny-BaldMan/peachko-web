<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEACHKO — Login & Sign Up</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@4/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css" />

  <style>
    .auth-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 5% 60px;
      background: linear-gradient(135deg, var(--bg), var(--peach));
    }

    .auth-container {
      width: 100%;
      max-width: 450px;
      background: var(--white);
      padding: 40px;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-xl);
      position: relative;
      overflow: hidden;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--peach-mid));
    }

    .auth-tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-lt);
    }

    .auth-tab {
      padding: 10px 0;
      font-family: var(--fb);
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      position: relative;
    }

    .auth-tab.active {
      color: var(--accent);
    }

    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
    }

    .auth-form {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .auth-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-family: var(--fb);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
    }

    .auth-btn {
      margin-top: 10px;
      width: 100%;
    }

    .auth-footer {
      margin-top: 25px;
      text-align: center;
      font-family: var(--fb);
      font-size: 13px;
      color: var(--muted);
    }

    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    /* Additional signup fields */
    .signup-extra {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
  </style>
</head>

<body>
  <header id="header" class="scrolled">
    <div class="logo" onclick="location.href='index.html'">PEACHKO</div>
    <nav>
      <div class="lang-wrap">
        <button class="lang-toggle" id="langToggle">KO</button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-opt" data-lang="ko">한국어 (KO)</button>
          <button class="lang-opt" data-lang="en">English (EN)</button>
          <button class="lang-opt" data-lang="zh">中文 (ZH)</button>
        </div>
      </div>
      <button class="nav-link" onclick="location.href='index.html'">Back to Home</button>
    </nav>
  </header>

  <section class="auth-section">
    <div class="auth-container reveal">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Login</button>
        <button class="auth-tab" id="tab-signup">Sign Up</button>
      </div>

      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="example@mail.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-accent auth-btn">Login</button>
        <div class="auth-footer">
          <a href="#">Forgot password?</a>
        </div>
      </form>

      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Your Name" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="example@mail.com" required />
        </div>
        <div class="signup-extra">
          <div class="form-group">
            <label>Nationality</label>
            <input type="text" id="signupNation" placeholder="e.g. USA" required />
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="signupPhone" placeholder="+82..." required />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="At least 8 characters" required />
        </div>
        <div style="display: flex; align-items: flex-start; gap: 10px; margin: 5px 0;">
          <input type="checkbox" id="consent" style="width: auto; margin-top: 4px;" required />
          <label for="consent" style="text-transform: none; font-size: 12px; color: var(--muted); letter-spacing: 0;">
            I agree to the <a href="privacy.html" target="_blank" style="color: var(--accent);">Privacy Policy</a>.
          </label>
        </div>
        <button type="submit" class="btn-accent auth-btn">Create Account</button>
      </form>
    </div>
  </section>

  <script type="module" src="script.js"></script>

  <script type="module">
    import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
      authDomain: "peachko-dev.firebaseapp.com",
      projectId: "peachko-dev",
      storageBucket: "peachko-dev.firebasestorage.app",
      messagingSenderId: "561367230685",
      appId: "1:561367230685:web:5576c1897b5989c243d334"
    };

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 탭 전환 로직
    const loginTab = document.getElementById('tab-login');
    const signupTab = document.getElementById('tab-signup');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');

    loginTab.addEventListener('click', () => {
      loginTab.classList.add('active');
      signupTab.classList.remove('active');
      loginForm.classList.add('active');
      signupForm.classList.remove('active');
    });

    signupTab.addEventListener('click', () => {
      signupTab.classList.add('active');
      loginTab.classList.remove('active');
      signupForm.classList.add('active');
      loginForm.classList.remove('active');
    });

    // 로그인 처리
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      const btn = loginForm.querySelector('button');

      try {
        btn.disabled = true;
        btn.textContent = "Logging in...";
        await signInWithEmailAndPassword(auth, email, pass);
        window.location.href = "index.html";
      } catch (err) {
        alert("Login failed: " + err.message);
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });

    // 회원가입 처리
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const nation = document.getElementById('signupNation').value;
      const phone = document.getElementById('signupPhone').value;
      const pass = document.getElementById('signupPassword').value;
      const btn = signupForm.querySelector('button');

      try {
        btn.disabled = true;
        btn.textContent = "Creating Account...";
        const { user } = await createUserWithEmailAndPassword(auth, email, pass);

        // Firestore에 사용자 추가 정보 저장
        await setDoc(doc(db, "users", user.uid), {
          name, email, nationality: nation, phone,
          role: "user",
          createdAt: serverTimestamp()
        });

        alert("Welcome to PEACHKO!");
        window.location.href = "index.html";
      } catch (err) {
        alert("Signup failed: " + err.message);
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem("peachko_lang") || "ko";
      if (window.applyLanguage) window.applyLanguage(savedLang); // 이름 변경 및 체크
    });

  </script>
  <button class="auth-tab active" id="tab-login" data-key="login_tab">Login</button>
  <button class="auth-tab" id="tab-signup" data-key="signup_tab">Sign Up</button>

  <div id="login-form-wrap">
    <h2 data-key="login_h2">Welcome Back</h2>
    <p data-key="login_p">Access your account...</p>
    <label data-key="email_label">Email Address</label>
    <label data-key="pass_label">Password</label>
    <button type="submit" class="btn-accent full-btn" data-key="btn_login">Login</button>
  </div>
  <label data-key="email_l">Email Address</label>
</body>

</html>
