<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEACHKO — Login & Sign Up</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@4/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@4/500.css" />

  <style>
    .auth-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 5% 60px;
      background: linear-gradient(135deg, var(--bg), var(--peach));
    }

    .auth-container {
      width: 100%;
      max-width: 450px;
      background: var(--white);
      padding: 40px;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-xl);
      position: relative;
      overflow: hidden;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--peach-mid));
    }

    .auth-tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-lt);
    }

    .auth-tab {
      padding: 10px 0;
      font-family: var(--fb);
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      position: relative;
    }

    .auth-tab.active {
      color: var(--accent);
    }

    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
    }

    .auth-form {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .auth-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-family: var(--fb);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
    }

    .auth-btn {
      margin-top: 10px;
      width: 100%;
    }

    .auth-footer {
      margin-top: 25px;
      text-align: center;
      font-family: var(--fb);
      font-size: 13px;
      color: var(--muted);
    }

    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .signup-extra {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .consent-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 5px 0;
    }

    .consent-row input[type="checkbox"] {
      width: auto;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .consent-row label {
      text-transform: none !important;
      font-size: 12px !important;
      color: var(--muted) !important;
      letter-spacing: 0 !important;
    }

    .consent-row label a {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <header id="header" class="scrolled">
    <div class="logo" onclick="location.href='index.html'">PEACHKO</div>
    <nav>
      <div class="lang-wrap">
        <button class="lang-toggle" id="langToggle">KO</button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-opt" data-lang="ko">한국어 (KO)</button>
          <button class="lang-opt" data-lang="en">English (EN)</button>
          <button class="lang-opt" data-lang="zh">中文 (ZH)</button>
        </div>
      </div>
      <button class="nav-link" onclick="location.href='index.html'">Back to Home</button>
    </nav>
  </header>

  <section class="auth-section">
    <div class="auth-container reveal">

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" data-key="login_tab">로그인</button>
        <button class="auth-tab" id="tab-signup" data-key="signup_tab">회원가입</button>
      </div>

      <!-- 로그인 폼 -->
      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label data-key="email_label">이메일 주소</label>
          <input type="email" id="loginEmail" data-ph-key="email_label" placeholder="이메일 주소" required />
        </div>
        <div class="form-group">
          <label data-key="pass_label">비밀번호</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-accent auth-btn" data-key="btn_login">로그인</button>
        <div class="auth-footer">
          <a href="#" data-key="forgot_pw">비밀번호를 잊으셨나요?</a>
        </div>
      </form>

      <!-- 회원가입 폼 -->
      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label data-key="name_label">이름</label>
          <input type="text" id="signupName" data-ph-key="name_label" placeholder="이름" required />
        </div>
        <div class="form-group">
          <label data-key="email_label">이메일 주소</label>
          <input type="email" id="signupEmail" data-ph-key="email_label" placeholder="이메일 주소" required />
        </div>
        <div class="signup-extra">
          <div class="form-group">
            <label data-key="nation_label">국적</label>
            <input type="text" id="signupNation" data-ph-key="nation_label" placeholder="국적" required />
          </div>
          <div class="form-group">
            <label data-key="phone_label">전화번호</label>
            <input type="tel" id="signupPhone" data-ph-key="phone_label" placeholder="+82..." required />
          </div>
        </div>
        <div class="form-group">
          <label data-key="pass_label">비밀번호</label>
          <input type="password" id="signupPassword" placeholder="8자 이상" required />
        </div>
        <div class="consent-row">
          <input type="checkbox" id="consent" required />
          <label for="consent">
            <span data-key="consent_text">개인정보 처리방침에 동의합니다.</span>
            (<a href="privacy.html" target="_blank">Privacy Policy</a>)
          </label>
        </div>
        <button type="submit" class="btn-accent auth-btn" data-key="btn_signup">회원가입</button>
      </form>

    </div>
  </section>

  <script type="module" src="script.js"></script>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAyy0UF4jFUotKJubr5QcErYilCvaNn-PY",
      authDomain: "peachko-dev.firebaseapp.com",
      projectId: "peachko-dev",
      storageBucket: "peachko-dev.firebasestorage.app",
      messagingSenderId: "561367230685",
      appId: "1:561367230685:web:5576c1897b5989c243d334"
    };

    const app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 탭 전환
    const loginTab = document.getElementById('tab-login');
    const signupTab = document.getElementById('tab-signup');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');

    loginTab.addEventListener('click', () => {
      loginTab.classList.add('active'); signupTab.classList.remove('active');
      loginForm.classList.add('active'); signupForm.classList.remove('active');
    });
    signupTab.addEventListener('click', () => {
      signupTab.classList.add('active'); loginTab.classList.remove('active');
      signupForm.classList.add('active'); loginForm.classList.remove('active');
    });

    const ADMIN_EMAIL = "admin@admin.com";

    // 로그인
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = loginForm.querySelector('button[type="submit"]');
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      try {
        btn.disabled = true; btn.textContent = "...";
        await signInWithEmailAndPassword(auth, email,
          document.getElementById('loginPassword').value
        );
        // admin 계정이면 대시보드로, 일반 유저면 메인으로
        window.location.href = email === ADMIN_EMAIL ? "admin.html" : "index.html";
      } catch (err) {
        alert("Login failed: " + err.message);
        btn.disabled = false;
        btn.textContent = window.peachkoLang?.t('btn_login') || 'Login';
      }
    });

    // 회원가입
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = signupForm.querySelector('button[type="submit"]');
      try {
        btn.disabled = true; btn.textContent = "...";
        const { user } = await createUserWithEmailAndPassword(auth,
          document.getElementById('signupEmail').value,
          document.getElementById('signupPassword').value
        );
        await setDoc(doc(db, "users", user.uid), {
          name: document.getElementById('signupName').value,
          email: document.getElementById('signupEmail').value,
          nationality: document.getElementById('signupNation').value,
          phone: document.getElementById('signupPhone').value,
          role: "user",
          createdAt: serverTimestamp()
        });
        alert("Welcome to PEACHKO!");
        window.location.href = "index.html";
      } catch (err) {
        alert("Signup failed: " + err.message);
        btn.disabled = false;
        btn.textContent = window.peachkoLang?.t('btn_signup') || 'Sign Up';
      }
    });
  </script>
</body>

</html>
